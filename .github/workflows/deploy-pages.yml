name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/backend/src/lib/product-parser.ts"
      - "services/backend/src/lib/robots.ts"
      - "scripts/fetch-catalog.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /poke-fr-pull
      NEXT_PUBLIC_API_BASE_URL: https://poke-fr-api.kais-battaia.workers.dev
      CATALOG_FALLBACK_URL: https://mwrtyy.github.io/poke-fr-pull/catalog.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm --filter @poke-fr/web build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
